<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Publicar Addon - MCPixel</title>

  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;700&family=Poppins:wght@300;500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link rel="icon" href="./img/logo2.png" type="image/png">

  <style>
    :root {
      --transition-fast: 260ms;
      --primary-color: #3a86ff;
      --secondary-color: #8338ec;
      --accent-color: #ff006e;
      --dark-bg: #0a0a12;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html, body {
      height: 100%;
      background: var(--dark-bg);
      font-family: "Poppins", "Montserrat", system-ui, -apple-system, "Segoe UI", Roboto, Arial;
      color: #fff;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
    }

    .navbar {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      z-index: 1000;
      padding: 1.2rem 2rem;
      background: rgba(10, 10, 18, 0.98);
      backdrop-filter: blur(20px);
      border-bottom: 1px solid rgba(255, 255, 255, 0.1);
    }

    .nav-container {
      display: flex;
      justify-content: space-between;
      align-items: center;
      max-width: 1400px;
      margin: 0 auto;
    }

    .nav-logo {
      display: flex;
      align-items: center;
      gap: 1rem;
    }

    .nav-logo img {
      height: 70px;
      width: auto;
      filter: drop-shadow(0 0 15px rgba(58, 134, 255, 0.4));
    }

    .nav-title {
      font-size: 1.8rem;
      font-weight: 700;
      background: linear-gradient(135deg, var(--primary-color), var(--accent-color));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .back-btn {
      background: rgba(255, 255, 255, 0.1);
      border: 1px solid rgba(255, 255, 255, 0.2);
      color: white;
      padding: 10px 20px;
      border-radius: 10px;
      cursor: pointer;
      text-decoration: none;
      transition: all 0.3s ease;
    }

    .back-btn:hover {
      background: rgba(255, 255, 255, 0.2);
    }

    .container {
      min-height: 100vh;
      padding: 120px 20px 40px;
      display: flex;
      flex-direction: column;
      align-items: center;
      max-width: 1200px;
      margin: 0 auto;
    }

    .user-setup {
      background: rgba(10, 10, 15, 0.5);
      padding: 30px;
      border-radius: 20px;
      border: 1px solid rgba(255, 255, 255, 0.1);
      text-align: center;
      margin-bottom: 30px;
      width: 100%;
    }

    .user-setup h2 {
      margin-bottom: 20px;
      color: white;
    }

    .user-input {
      width: 300px;
      padding: 12px 15px;
      background: rgba(255, 255, 255, 0.1);
      border: 1px solid rgba(255, 255, 255, 0.2);
      border-radius: 10px;
      color: white;
      margin-bottom: 15px;
    }

    .user-input::placeholder {
      color: rgba(255, 255, 255, 0.5);
    }

    .confirm-btn {
      background: var(--primary-color);
      color: white;
      border: none;
      padding: 12px 30px;
      border-radius: 10px;
      cursor: pointer;
      font-size: 1rem;
      transition: all 0.3s ease;
    }

    .confirm-btn:hover {
      background: #2a75ff;
    }

    .current-user {
      background: rgba(10, 10, 15, 0.5);
      padding: 20px;
      border-radius: 15px;
      border: 1px solid rgba(255, 255, 255, 0.1);
      margin-bottom: 30px;
      width: 100%;
      text-align: center;
    }

    .current-user h3 {
      color: var(--primary-color);
      margin-bottom: 10px;
    }

    .publish-form {
      background: rgba(10, 10, 15, 0.5);
      padding: 30px;
      border-radius: 20px;
      border: 1px solid rgba(255, 255, 255, 0.1);
      width: 100%;
      margin-bottom: 40px;
    }

    .form-group {
      margin-bottom: 20px;
    }

    .form-group label {
      display: block;
      margin-bottom: 8px;
      color: rgba(255, 255, 255, 0.9);
    }

    .form-input {
      width: 100%;
      padding: 12px 15px;
      background: rgba(255, 255, 255, 0.1);
      border: 1px solid rgba(255, 255, 255, 0.2);
      border-radius: 10px;
      color: white;
      font-size: 1rem;
    }

    .form-input::placeholder {
      color: rgba(255, 255, 255, 0.5);
    }

    .image-preview {
      width: 200px;
      height: 200px;
      border-radius: 15px;
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid rgba(255, 255, 255, 0.1);
      margin: 15px auto;
      overflow: hidden;
      display: none;
    }

    .image-preview img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .publish-btn {
      background: var(--primary-color);
      color: white;
      border: none;
      padding: 15px 40px;
      border-radius: 10px;
      cursor: pointer;
      font-size: 1.1rem;
      width: 100%;
      transition: all 0.3s ease;
    }

    .publish-btn:hover {
      background: #2a75ff;
    }

    .cards-container {
      display: flex;
      flex-direction: column;
      gap: 25px;
      width: 100%;
    }

    .card {
      background: rgba(10, 10, 15, 0.5);
      border-radius: 20px;
      padding: 25px;
      border: 1px solid rgba(255, 255, 255, 0.08);
      display: flex;
      align-items: center;
      gap: 20px;
      position: relative;
    }

    .logo-frame {
      width: 80px;
      height: 80px;
      border-radius: 15px;
      background: rgba(255, 255, 255, 0.03);
      border: 1px solid rgba(255, 255, 255, 0.08);
      overflow: hidden;
      flex-shrink: 0;
    }

    .logo-frame img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .card-info {
      flex: 1;
    }

    .card-title {
      font-size: 1.5rem;
      font-weight: 700;
      color: #ffffff;
      margin-bottom: 5px;
    }

    .author-container {
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .card-author {
      font-size: 1rem;
      color: rgba(255, 255, 255, 0.8);
    }

    .author-name {
      color: var(--primary-color);
      font-weight: 600;
    }

    .version-container {
      position: absolute;
      bottom: 15px;
      right: 20px;
      background: rgba(255, 255, 255, 0.05);
      padding: 5px 10px;
      border-radius: 10px;
      border: 1px solid rgba(255, 255, 255, 0.1);
    }

    .version-text {
      font-size: 0.85rem;
      color: rgba(255, 255, 255, 0.8);
    }

    .edit-btn {
      position: absolute;
      top: 15px;
      right: 15px;
      background: rgba(255, 255, 255, 0.1);
      border: 1px solid rgba(255, 255, 255, 0.2);
      color: white;
      padding: 8px 12px;
      border-radius: 8px;
      cursor: pointer;
      font-size: 0.9rem;
    }

    .edit-form {
      display: none;
      background: rgba(15, 15, 20, 0.8);
      padding: 20px;
      border-radius: 15px;
      margin-top: 15px;
      border: 1px solid rgba(255, 255, 255, 0.1);
    }

    .form-actions {
      display: flex;
      gap: 10px;
      margin-top: 15px;
    }

    .save-btn {
      background: var(--primary-color);
      color: white;
      border: none;
      padding: 8px 20px;
      border-radius: 8px;
      cursor: pointer;
    }

    .cancel-btn {
      background: rgba(255, 255, 255, 0.1);
      color: white;
      border: 1px solid rgba(255, 255, 255, 0.2);
      padding: 8px 20px;
      border-radius: 8px;
      cursor: pointer;
    }

    .message {
      padding: 10px 15px;
      border-radius: 8px;
      margin-bottom: 15px;
      text-align: center;
      display: none;
    }

    .success {
      background: rgba(76, 175, 80, 0.2);
      border: 1px solid rgba(76, 175, 80, 0.5);
      color: #4CAF50;
    }

    .error {
      background: rgba(244, 67, 54, 0.2);
      border: 1px solid rgba(244, 67, 54, 0.5);
      color: #f44336;
    }

    .loading {
      text-align: center;
      color: rgba(255, 255, 255, 0.6);
      margin: 20px 0;
    }
  </style>
</head>
<body>

  <nav class="navbar">
    <div class="nav-container">
      <div class="nav-logo">
        <img src="./img/logo.png" alt="MegaPixelFL">
        <div class="nav-title">Publicar Addon</div>
      </div>
      <a href="index.html" class="back-btn">
        <i class="fas fa-arrow-left"></i> Volver
      </a>
    </div>
  </nav>

  <div class="container">
    <!-- Configuración de Usuario -->
    <div class="user-setup" id="userSetup">
      <h2>Configura tu nombre de usuario</h2>
      <input type="text" class="user-input" id="usernameInput" placeholder="Tu nombre de usuario">
      <button class="confirm-btn" onclick="setUsername()">Confirmar</button>
    </div>

    <!-- Usuario Actual -->
    <div class="current-user" id="currentUser" style="display: none;">
      <h3>Publicando como: <span id="currentUsername"></span></h3>
    </div>

    <!-- Mensajes -->
    <div class="message" id="message"></div>

    <!-- Formulario de Publicación -->
    <div class="publish-form" id="publishForm" style="display: none;">
      <h2 style="margin-bottom: 20px; text-align: center;">Publicar Nuevo Addon</h2>
      
      <div class="form-group">
        <label>URL de la imagen de portada:</label>
        <input type="url" class="form-input" id="imageUrl" placeholder="https://ejemplo.com/imagen.jpg" oninput="previewImage()">
      </div>

      <div class="image-preview" id="imagePreview">
        <img id="previewImg" src="" alt="Vista previa">
      </div>

      <div class="form-group">
        <label>Nombre del Addon:</label>
        <input type="text" class="form-input" id="addonName" placeholder="Nombre de tu addon">
      </div>

      <div class="form-group">
        <label>Versión de Minecraft:</label>
        <input type="text" class="form-input" id="minecraftVersion" placeholder="1.20.1">
      </div>

      <div class="form-group">
        <label>URL de descarga:</label>
        <input type="url" class="form-input" id="downloadUrl" placeholder="https://ejemplo.com/descarga">
      </div>

      <button class="publish-btn" onclick="publishAddon()">Publicar Addon</button>
    </div>

    <!-- Addons Publicados -->
    <h2 style="width: 100%; margin-bottom: 20px;">Tus Addons Publicados</h2>
    <div class="loading" id="loadingAddons" style="display: none;">Cargando tus addons...</div>
    <div class="cards-container" id="userAddonsContainer"></div>
  </div>

  <script src="./js/list.js"></script>
  <script>
    // CONFIGURACIÓN ACTUALIZADA CON TUS DATOS REALES
    const JSONBIN_BIN_ID = '690d4c7843b1c97be99dc705';
    const JSONBIN_MASTER_KEY = '$2a$10$IO4HdN4Wy8PwCaYknx9Yxegti3kHcf8gxUWMldt2yaEuuhDZxvD/2';
    let lastRequestTime = 0;
    const REQUEST_DELAY = 1000;

    let currentUser = localStorage.getItem('mcPixelUsername');
    let userAddons = [];

    // Inicializar página
    function init() {
      if (currentUser) {
        showPublishForm();
      }
      loadUserAddons();
    }

    // Establecer nombre de usuario
    function setUsername() {
      const username = document.getElementById('usernameInput').value.trim();
      if (username) {
        currentUser = username;
        localStorage.setItem('mcPixelUsername', username);
        showPublishForm();
        showMessage('Usuario configurado correctamente', 'success');
      } else {
        showMessage('Por favor ingresa un nombre de usuario', 'error');
      }
    }

    // Mostrar formulario de publicación
    function showPublishForm() {
      document.getElementById('userSetup').style.display = 'none';
      document.getElementById('currentUser').style.display = 'block';
      document.getElementById('publishForm').style.display = 'block';
      document.getElementById('currentUsername').textContent = currentUser;
    }

    // Vista previa de imagen
    function previewImage() {
      const imageUrl = document.getElementById('imageUrl').value;
      const preview = document.getElementById('imagePreview');
      const previewImg = document.getElementById('previewImg');
      
      if (imageUrl) {
        previewImg.src = imageUrl;
        preview.style.display = 'block';
        previewImg.onerror = function() {
          preview.style.display = 'none';
          showMessage('Error al cargar la imagen', 'error');
        };
      } else {
        preview.style.display = 'none';
      }
    }

    // Rate limiting para peticiones
    async function makeRequest(url, options = {}) {
      const now = Date.now();
      const timeSinceLastRequest = now - lastRequestTime;
      
      if (timeSinceLastRequest < REQUEST_DELAY) {
        await new Promise(resolve => setTimeout(resolve, REQUEST_DELAY - timeSinceLastRequest));
      }
      
      lastRequestTime = Date.now();
      const response = await fetch(url, options);
      return response.json();
    }

    // Publicar addon
    async function publishAddon() {
      const imageUrl = document.getElementById('imageUrl').value;
      const addonName = document.getElementById('addonName').value;
      const minecraftVersion = document.getElementById('minecraftVersion').value;
      const downloadUrl = document.getElementById('downloadUrl').value;

      if (!imageUrl || !addonName || !minecraftVersion || !downloadUrl) {
        showMessage('Por favor completa todos los campos', 'error');
        return;
      }

      try {
        // Obtener addons existentes
        const data = await makeRequest(`https://api.jsonbin.io/v3/b/${JSONBIN_BIN_ID}/latest`, {
          headers: { 'X-Master-Key': JSONBIN_MASTER_KEY }
        });

        const addons = data.record?.addons || [];
        
        // Agregar nuevo addon
        const newAddon = {
          id: Date.now().toString(),
          name: addonName,
          author: currentUser,
          imageUrl: imageUrl,
          version: minecraftVersion,
          downloadUrl: downloadUrl,
          timestamp: new Date().toISOString()
        };

        addons.push(newAddon);

        // Actualizar en JSONBin.io
        await makeRequest(`https://api.jsonbin.io/v3/b/${JSONBIN_BIN_ID}`, {
          method: 'PUT',
          headers: {
            'Content-Type': 'application/json',
            'X-Master-Key': JSONBIN_MASTER_KEY
          },
          body: JSON.stringify({ addons: addons })
        });

        // Limpiar formulario
        document.getElementById('imageUrl').value = '';
        document.getElementById('addonName').value = '';
        document.getElementById('minecraftVersion').value = '';
        document.getElementById('downloadUrl').value = '';
        document.getElementById('imagePreview').style.display = 'none';

        showMessage('Addon publicado correctamente', 'success');
        loadUserAddons();

      } catch (error) {
        console.error('Error publicando addon:', error);
        showMessage('Error al publicar el addon', 'error');
      }
    }

    // Cargar addons del usuario
    async function loadUserAddons() {
      if (!currentUser) return;

      try {
        document.getElementById('loadingAddons').style.display = 'block';
        
        const data = await makeRequest(`https://api.jsonbin.io/v3/b/${JSONBIN_BIN_ID}/latest`, {
          headers: { 'X-Master-Key': JSONBIN_MASTER_KEY }
        });

        const allAddons = data.record?.addons || [];
        userAddons = allAddons.filter(addon => addon.author === currentUser);
        displayUserAddons();

      } catch (error) {
        console.error('Error cargando addons:', error);
        showMessage('Error al cargar los addons', 'error');
      } finally {
        document.getElementById('loadingAddons').style.display = 'none';
      }
    }

    // Mostrar addons del usuario
    function displayUserAddons() {
      const container = document.getElementById('userAddonsContainer');
      
      if (userAddons.length === 0) {
        container.innerHTML = '<p style="text-align: center; color: rgba(255,255,255,0.6);">No has publicado ningún addon aún</p>';
        return;
      }

      container.innerHTML = userAddons.map(addon => `
        <div class="card" data-id="${addon.id}">
          <div class="logo-frame">
            <img src="${addon.imageUrl}" alt="${addon.name}" onerror="this.src='https://via.placeholder.com/150/0a0a12/3a86ff?text=Addon'">
          </div>
          <div class="card-info">
            <h2 class="card-title">${addon.name}</h2>
            <div class="author-container">
              <p class="card-author">by <span class="author-name">${addon.author}</span></p>
              ${verifiedUsers.includes(addon.author) ? `
                <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="currentColor" style="width: 16px; height: 16px; color: var(--primary-color);">
                  <path fill-rule="evenodd" d="M8.603 3.799A4.49 4.49 0 0112 2.25c1.357 0 2.573.6 3.397 1.549a4.49 4.49 0 013.498 1.307 4.491 4.491 0 011.307 3.497A4.49 4.49 0 0121.75 12a4.49 4.49 0 01-1.549 3.397 4.491 4.491 0 01-1.307 3.497 4.491 4.491 0 01-3.497 1.307A4.49 4.49 0 0112 21.75a4.49 4.49 0 01-3.397-1.549 4.49 4.49 0 01-3.498-1.306 4.491 4.491 0 01-1.307-3.498A4.49 4.49 0 012.25 12c0-1.357.6-2.573 1.549-3.397a4.49 4.49 0 011.307-3.497 4.49 4.49 0 013.497-1.307zm7.007 6.387a.75.75 0 10-1.22-.872l-3.236 4.53L9.53 12.22a.75.75 0 00-1.06 1.06l2.25 2.25a.75.75 0 001.14-.094l3.75-5.25z" clip-rule="evenodd" />
                </svg>
              ` : ''}
            </div>
          </div>
          <div class="version-container">
            <span class="version-text">v${addon.version}</span>
          </div>
          <button class="edit-btn" onclick="toggleEditForm('${addon.id}')">Editar</button>
          
          <div class="edit-form" id="editForm-${addon.id}">
            <div class="form-group">
              <label>URL de la imagen:</label>
              <input type="url" class="form-input" id="editImageUrl-${addon.id}" value="${addon.imageUrl}">
            </div>
            <div class="form-group">
              <label>Nombre:</label>
              <input type="text" class="form-input" id="editName-${addon.id}" value="${addon.name}">
            </div>
            <div class="form-group">
              <label>Versión:</label>
              <input type="text" class="form-input" id="editVersion-${addon.id}" value="${addon.version}">
            </div>
            <div class="form-group">
              <label>URL de descarga:</label>
              <input type="url" class="form-input" id="editDownloadUrl-${addon.id}" value="${addon.downloadUrl}">
            </div>
            <div class="form-actions">
              <button class="save-btn" onclick="updateAddon('${addon.id}')">Guardar</button>
              <button class="cancel-btn" onclick="toggleEditForm('${addon.id}')">Cancelar</button>
            </div>
          </div>
        </div>
      `).join('');
    }

    // Mostrar/ocultar formulario de edición
    function toggleEditForm(addonId) {
      const form = document.getElementById(`editForm-${addonId}`);
      form.style.display = form.style.display === 'none' ? 'block' : 'none';
    }

    // Actualizar addon
    async function updateAddon(addonId) {
      try {
        const imageUrl = document.getElementById(`editImageUrl-${addonId}`).value;
        const name = document.getElementById(`editName-${addonId}`).value;
        const version = document.getElementById(`editVersion-${addonId}`).value;
        const downloadUrl = document.getElementById(`editDownloadUrl-${addonId}`).value;

        if (!imageUrl || !name || !version || !downloadUrl) {
          showMessage('Por favor completa todos los campos', 'error');
          return;
        }

        // Obtener addons existentes
        const data = await makeRequest(`https://api.jsonbin.io/v3/b/${JSONBIN_BIN_ID}/latest`, {
          headers: { 'X-Master-Key': JSONBIN_MASTER_KEY }
        });

        const addons = data.record?.addons || [];
        const addonIndex = addons.findIndex(addon => addon.id === addonId);

        if (addonIndex !== -1) {
          // Actualizar addon
          addons[addonIndex] = {
            ...addons[addonIndex],
            imageUrl: imageUrl,
            name: name,
            version: version,
            downloadUrl: downloadUrl
          };

          // Guardar cambios
          await makeRequest(`https://api.jsonbin.io/v3/b/${JSONBIN_BIN_ID}`, {
            method: 'PUT',
            headers: {
              'Content-Type': 'application/json',
              'X-Master-Key': JSONBIN_MASTER_KEY
            },
            body: JSON.stringify({ addons: addons })
          });

          showMessage('Addon actualizado correctamente', 'success');
          loadUserAddons();
        }

      } catch (error) {
        console.error('Error actualizando addon:', error);
        showMessage('Error al actualizar el addon', 'error');
      }
    }

    // Mostrar mensajes
    function showMessage(text, type) {
      const message = document.getElementById('message');
      message.textContent = text;
      message.className = `message ${type}`;
      message.style.display = 'block';
      
      setTimeout(() => {
        message.style.display = 'none';
      }, 5000);
    }

    // Inicializar cuando se carga la página
    document.addEventListener('DOMContentLoaded', init);
  </script>
</body>
</html>
