<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Publicar Addon - MCPixel</title>

  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;700&family=Poppins:wght@300;500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link rel="icon" href="../img/logo2.png" type="image/png">

  <style>
    :root {
      --primary-color: #3a86ff;
      --secondary-color: #8338ec;
      --accent-color: #ff006e;
      --dark-bg: #0a0a12;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html, body {
      height: 100%;
      background: var(--dark-bg);
      font-family: "Poppins", "Montserrat", system-ui, -apple-system, "Segoe UI", Roboto, Arial;
      color: #fff;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
    }

    .navbar {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      z-index: 1000;
      padding: 1rem 1.5rem;
      background: rgba(10, 10, 18, 0.98);
      backdrop-filter: blur(20px);
      border-bottom: 1px solid rgba(255, 255, 255, 0.1);
    }

    .nav-container {
      display: flex;
      justify-content: space-between;
      align-items: center;
      max-width: 1400px;
      margin: 0 auto;
    }

    .nav-logo {
      display: flex;
      align-items: center;
      gap: 1rem;
    }

    .nav-logo img {
      height: 50px;
      width: auto;
      filter: drop-shadow(0 0 15px rgba(58, 134, 255, 0.4));
    }

    .nav-title {
      font-size: 1.4rem;
      font-weight: 700;
      background: linear-gradient(135deg, var(--primary-color), var(--accent-color));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .back-btn {
      background: rgba(255, 255, 255, 0.1);
      border: 1px solid rgba(255, 255, 255, 0.2);
      color: white;
      padding: 8px 16px;
      border-radius: 8px;
      cursor: pointer;
      text-decoration: none;
      font-size: 0.9rem;
      transition: all 0.3s ease;
    }

    .back-btn:hover {
      background: rgba(255, 255, 255, 0.2);
    }

    .container {
      min-height: 100vh;
      padding: 100px 20px 40px;
      display: flex;
      flex-direction: column;
      align-items: center;
      max-width: 800px;
      margin: 0 auto;
    }

    .user-setup {
      background: rgba(10, 10, 15, 0.5);
      padding: 25px;
      border-radius: 15px;
      border: 1px solid rgba(255, 255, 255, 0.1);
      text-align: center;
      margin-bottom: 25px;
      width: 100%;
    }

    .user-setup h2 {
      margin-bottom: 15px;
      color: white;
      font-size: 1.3rem;
    }

    .user-input {
      width: 100%;
      max-width: 300px;
      padding: 12px 15px;
      background: rgba(255, 255, 255, 0.1);
      border: 1px solid rgba(255, 255, 255, 0.2);
      border-radius: 8px;
      color: white;
      margin-bottom: 15px;
      font-size: 0.95rem;
    }

    .user-input::placeholder {
      color: rgba(255, 255, 255, 0.5);
    }

    .confirm-btn {
      background: var(--primary-color);
      color: white;
      border: none;
      padding: 10px 25px;
      border-radius: 8px;
      cursor: pointer;
      font-size: 0.95rem;
      transition: all 0.3s ease;
    }

    .confirm-btn:hover {
      background: #2a75ff;
    }

    .current-user {
      background: rgba(10, 10, 15, 0.5);
      padding: 15px;
      border-radius: 12px;
      border: 1px solid rgba(255, 255, 255, 0.1);
      margin-bottom: 25px;
      width: 100%;
      text-align: center;
    }

    .current-user h3 {
      color: var(--primary-color);
      margin-bottom: 5px;
      font-size: 1.1rem;
    }

    .publish-form {
      background: rgba(10, 10, 15, 0.5);
      padding: 25px;
      border-radius: 15px;
      border: 1px solid rgba(255, 255, 255, 0.1);
      width: 100%;
      margin-bottom: 30px;
    }

    .form-group {
      margin-bottom: 15px;
    }

    .form-group label {
      display: block;
      margin-bottom: 6px;
      color: rgba(255, 255, 255, 0.9);
      font-size: 0.9rem;
    }

    .form-input {
      width: 100%;
      padding: 10px 12px;
      background: rgba(255, 255, 255, 0.1);
      border: 1px solid rgba(255, 255, 255, 0.2);
      border-radius: 8px;
      color: white;
      font-size: 0.95rem;
    }

    .form-input::placeholder {
      color: rgba(255, 255, 255, 0.5);
    }

    .image-preview {
      width: 150px;
      height: 150px;
      border-radius: 12px;
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid rgba(255, 255, 255, 0.1);
      margin: 12px auto;
      overflow: hidden;
      display: none;
    }

    .image-preview img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .publish-btn {
      background: var(--primary-color);
      color: white;
      border: none;
      padding: 12px 30px;
      border-radius: 8px;
      cursor: pointer;
      font-size: 1rem;
      width: 100%;
      transition: all 0.3s ease;
    }

    .publish-btn:hover {
      background: #2a75ff;
    }

    .cards-container {
      display: flex;
      flex-direction: column;
      gap: 20px;
      width: 100%;
    }

    .card {
      background: rgba(10, 10, 15, 0.5);
      border-radius: 15px;
      padding: 20px;
      border: 1px solid rgba(255, 255, 255, 0.08);
      display: flex;
      align-items: center;
      gap: 15px;
      position: relative;
    }

    .logo-frame {
      width: 70px;
      height: 70px;
      border-radius: 12px;
      background: rgba(255, 255, 255, 0.03);
      border: 1px solid rgba(255, 255, 255, 0.08);
      overflow: hidden;
      flex-shrink: 0;
    }

    .logo-frame img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .card-info {
      flex: 1;
    }

    .card-title {
      font-size: 1.3rem;
      font-weight: 700;
      color: #ffffff;
      margin-bottom: 4px;
    }

    .author-container {
      display: flex;
      align-items: center;
      gap: 5px;
    }

    .card-author {
      font-size: 0.9rem;
      color: rgba(255, 255, 255, 0.8);
    }

    .author-name {
      color: var(--primary-color);
      font-weight: 600;
    }

    .version-container {
      position: absolute;
      bottom: 12px;
      right: 15px;
      background: rgba(255, 255, 255, 0.05);
      padding: 4px 8px;
      border-radius: 8px;
      border: 1px solid rgba(255, 255, 255, 0.1);
    }

    .version-text {
      font-size: 0.8rem;
      color: rgba(255, 255, 255, 0.8);
    }

    .edit-btn {
      position: absolute;
      top: 12px;
      right: 12px;
      background: rgba(255, 255, 255, 0.1);
      border: 1px solid rgba(255, 255, 255, 0.2);
      color: white;
      padding: 6px 10px;
      border-radius: 6px;
      cursor: pointer;
      font-size: 0.8rem;
    }

    .delete-btn {
      position: absolute;
      top: 12px;
      right: 70px;
      background: rgba(244, 67, 54, 0.2);
      border: 1px solid rgba(244, 67, 54, 0.3);
      color: #f44336;
      padding: 6px 10px;
      border-radius: 6px;
      cursor: pointer;
      font-size: 0.8rem;
    }

    .delete-btn:hover {
      background: rgba(244, 67, 54, 0.3);
    }

    .edit-form {
      display: none;
      background: rgba(15, 15, 20, 0.8);
      padding: 15px;
      border-radius: 12px;
      margin-top: 12px;
      border: 1px solid rgba(255, 255, 255, 0.1);
    }

    .form-actions {
      display: flex;
      gap: 8px;
      margin-top: 12px;
    }

    .save-btn {
      background: var(--primary-color);
      color: white;
      border: none;
      padding: 6px 15px;
      border-radius: 6px;
      cursor: pointer;
      font-size: 0.85rem;
    }

    .cancel-btn {
      background: rgba(255, 255, 255, 0.1);
      color: white;
      border: 1px solid rgba(255, 255, 255, 0.2);
      padding: 6px 15px;
      border-radius: 6px;
      cursor: pointer;
      font-size: 0.85rem;
    }

    .message {
      padding: 8px 12px;
      border-radius: 6px;
      margin-bottom: 12px;
      text-align: center;
      display: none;
      font-size: 0.9rem;
    }

    .success {
      background: rgba(76, 175, 80, 0.2);
      border: 1px solid rgba(76, 175, 80, 0.5);
      color: #4CAF50;
    }

    .error {
      background: rgba(244, 67, 54, 0.2);
      border: 1px solid rgba(244, 67, 54, 0.5);
      color: #f44336;
    }

    .loading {
      text-align: center;
      color: rgba(255, 255, 255, 0.6);
      margin: 15px 0;
      font-size: 0.9rem;
    }

    .floating-btn {
      position: fixed;
      bottom: 25px;
      right: 25px;
      width: 50px;
      height: 50px;
      background: var(--primary-color);
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      color: white;
      font-size: 1.2rem;
      cursor: pointer;
      box-shadow: 0 4px 20px rgba(58, 134, 255, 0.4);
      transition: all 0.3s ease;
      z-index: 1000;
      border: none;
    }

    .floating-btn:hover {
      transform: scale(1.1);
      box-shadow: 0 6px 25px rgba(58, 134, 255, 0.6);
    }

    @media (max-width: 768px) {
      .navbar {
        padding: 0.8rem 1rem;
      }
      
      .nav-logo img {
        height: 40px;
      }
      
      .nav-title {
        font-size: 1.2rem;
      }
      
      .back-btn {
        padding: 6px 12px;
        font-size: 0.8rem;
      }
      
      .container {
        padding: 90px 15px 30px;
      }
      
      .user-setup, .publish-form {
        padding: 20px;
      }
      
      .card {
        padding: 15px;
        gap: 12px;
      }
      
      .logo-frame {
        width: 60px;
        height: 60px;
      }
      
      .card-title {
        font-size: 1.1rem;
      }
      
      .floating-btn {
        width: 45px;
        height: 45px;
        bottom: 20px;
        right: 20px;
      }
    }

    @media (max-width: 480px) {
      .container {
        padding: 80px 12px 25px;
      }
      
      .user-setup, .publish-form {
        padding: 15px;
      }
      
      .card {
        flex-direction: column;
        text-align: center;
        gap: 10px;
      }
      
      .author-container {
        justify-content: center;
      }
      
      .version-container {
        position: static;
        margin-top: 8px;
        display: inline-block;
      }
    }
  </style>
</head>
<body>

  <nav class="navbar">
    <div class="nav-container">
      <div class="nav-logo">
        <img src="./img/logo.png" alt="MegaPixelFL">
        <div class="nav-title">Publicar Addon</div>
      </div>
      <a href="./mcpixel.html" class="back-btn">
        <i class="fas fa-arrow-left"></i> Volver
      </a>
    </div>
  </nav>

  <div class="container">
    <div class="user-setup" id="userSetup">
      <h2>Configura tu nombre de usuario</h2>
      <input type="text" class="user-input" id="usernameInput" placeholder="Tu nombre de usuario">
      <button class="confirm-btn" onclick="setUsername()">Confirmar</button>
    </div>

    <div class="current-user" id="currentUser" style="display: none;">
      <h3>Publicando como: <span id="currentUsername"></span></h3>
    </div>

    <div class="message" id="message"></div>

    <div class="publish-form" id="publishForm" style="display: none;">
      <h2 style="margin-bottom: 15px; text-align: center; font-size: 1.3rem;">Publicar Nuevo Addon</h2>
      
      <div class="form-group">
        <label>URL de la imagen de portada:</label>
        <input type="url" class="form-input" id="imageUrl" placeholder="https://ejemplo.com/imagen.jpg" oninput="previewImage()">
      </div>

      <div class="image-preview" id="imagePreview">
        <img id="previewImg" src="" alt="Vista previa">
      </div>

      <div class="form-group">
        <label>Nombre del Addon:</label>
        <input type="text" class="form-input" id="addonName" placeholder="Nombre de tu addon">
      </div>

      <div class="form-group">
        <label>Versión de Minecraft:</label>
        <input type="text" class="form-input" id="minecraftVersion" placeholder="1.20.1">
      </div>

      <div class="form-group">
        <label>URL de descarga:</label>
        <input type="url" class="form-input" id="downloadUrl" placeholder="https://ejemplo.com/descarga">
      </div>

      <button class="publish-btn" onclick="publishAddon()">Publicar Addon</button>
    </div>

    <h2 style="width: 100%; margin-bottom: 15px; font-size: 1.3rem;">Tus Addons Publicados</h2>
    <div class="loading" id="loadingAddons" style="display: none;">Cargando tus addons...</div>
    <div class="cards-container" id="userAddonsContainer"></div>
  </div>

  <button class="floating-btn" onclick="showPublishForm()">
    <i class="fas fa-plus"></i>
  </button>

  <script>
    const JSONBIN_BIN_ID = '690d4c7843b1c97be99dc705';
    const JSONBIN_MASTER_KEY = '$2a$10$IO4HdN4Wy8PwCaYknx9Yxegti3kHcf8gxUWMldt2yaEuuhDZxvD/2';
    let lastRequestTime = 0;
    const REQUEST_DELAY = 1000;

    let currentUser = localStorage.getItem('mcPixelUsername');
    let userAddons = [];
    let verifiedUsers = ['admin', 'verified_user']; // Lista de usuarios verificados

    function init() {
      if (currentUser) {
        showPublishForm();
      }
      loadUserAddons();
    }

    function setUsername() {
      const username = document.getElementById('usernameInput').value.trim();
      if (username) {
        currentUser = username;
        localStorage.setItem('mcPixelUsername', username);
        showPublishForm();
        showMessage('Usuario configurado correctamente', 'success');
      } else {
        showMessage('Por favor ingresa un nombre de usuario', 'error');
      }
    }

    function showPublishForm() {
      document.getElementById('userSetup').style.display = 'none';
      document.getElementById('currentUser').style.display = 'block';
      document.getElementById('publishForm').style.display = 'block';
      document.getElementById('currentUsername').textContent = currentUser;
    }

    function previewImage() {
      const imageUrl = document.getElementById('imageUrl').value;
      const preview = document.getElementById('imagePreview');
      const previewImg = document.getElementById('previewImg');
      
      if (imageUrl) {
        previewImg.src = imageUrl;
        preview.style.display = 'block';
        previewImg.onerror = function() {
          preview.style.display = 'none';
          showMessage('Error al cargar la imagen', 'error');
        };
      } else {
        preview.style.display = 'none';
      }
    }

    async function makeRequest(url, options = {}) {
      const now = Date.now();
      const timeSinceLastRequest = now - lastRequestTime;
      
      if (timeSinceLastRequest < REQUEST_DELAY) {
        await new Promise(resolve => setTimeout(resolve, REQUEST_DELAY - timeSinceLastRequest));
      }
      
      lastRequestTime = Date.now();
      const response = await fetch(url, options);
      return response.json();
    }

    async function publishAddon() {
      const imageUrl = document.getElementById('imageUrl').value;
      const addonName = document.getElementById('addonName').value;
      const minecraftVersion = document.getElementById('minecraftVersion').value;
      const downloadUrl = document.getElementById('downloadUrl').value;

      if (!imageUrl || !addonName || !minecraftVersion || !downloadUrl) {
        showMessage('Por favor completa todos los campos', 'error');
        return;
      }

      try {
        const data = await makeRequest(`https://api.jsonbin.io/v3/b/${JSONBIN_BIN_ID}/latest`, {
          headers: { 'X-Master-Key': JSONBIN_MASTER_KEY }
        });

        const addons = data.record?.addons || [];
        
        const newAddon = {
          id: Date.now().toString(),
          name: addonName,
          author: currentUser,
          imageUrl: imageUrl,
          version: minecraftVersion,
          downloadUrl: downloadUrl,
          timestamp: new Date().toISOString()
        };

        addons.push(newAddon);

        await makeRequest(`https://api.jsonbin.io/v3/b/${JSONBIN_BIN_ID}`, {
          method: 'PUT',
          headers: {
            'Content-Type': 'application/json',
            'X-Master-Key': JSONBIN_MASTER_KEY
          },
          body: JSON.stringify({ addons: addons })
        });

        document.getElementById('imageUrl').value = '';
        document.getElementById('addonName').value = '';
        document.getElementById('minecraftVersion').value = '';
        document.getElementById('downloadUrl').value = '';
        document.getElementById('imagePreview').style.display = 'none';

        showMessage('Addon publicado correctamente', 'success');
        loadUserAddons();

      } catch (error) {
        console.error('Error publicando addon:', error);
        showMessage('Error al publicar el addon', 'error');
      }
    }

    async function loadUserAddons() {
      if (!currentUser) return;

      try {
        document.getElementById('loadingAddons').style.display = 'block';
        
        const data = await makeRequest(`https://api.jsonbin.io/v3/b/${JSONBIN_BIN_ID}/latest`, {
          headers: { 'X-Master-Key': JSONBIN_MASTER_KEY }
        });

        const allAddons = data.record?.addons || [];
        userAddons = allAddons.filter(addon => addon.author === currentUser);
        displayUserAddons();

      } catch (error) {
        console.error('Error cargando addons:', error);
        showMessage('Error al cargar los addons', 'error');
      } finally {
        document.getElementById('loadingAddons').style.display = 'none';
      }
    }

    function displayUserAddons() {
      const container = document.getElementById('userAddonsContainer');
      
      if (userAddons.length === 0) {
        container.innerHTML = '<p style="text-align: center; color: rgba(255,255,255,0.6);">No has publicado ningún addon aún</p>';
        return;
      }

      container.innerHTML = userAddons.map(addon => `
        <div class="card" data-id="${addon.id}">
          <div class="logo-frame">
            <img src="${addon.imageUrl}" alt="${addon.name}" onerror="this.src='https://via.placeholder.com/150/0a0a12/3a86ff?text=Addon'">
          </div>
          <div class="card-info">
            <h2 class="card-title">${addon.name}</h2>
            <div class="author-container">
              <p class="card-author">by <span class="author-name">${addon.author}</span></p>
              ${verifiedUsers.includes(addon.author) ? `
                <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="currentColor" style="width: 14px; height: 14px; color: var(--primary-color);">
                  <path fill-rule="evenodd" d="M8.603 3.799A4.49 4.49 0 0112 2.25c1.357 0 2.573.6 3.397 1.549a4.49 4.49 0 013.498 1.307 4.491 4.491 0 011.307 3.497A4.49 4.49 0 0121.75 12a4.49 4.49 0 01-1.549 3.397 4.491 4.491 0 01-1.307 3.497 4.491 4.491 0 01-3.497 1.307A4.49 4.49 0 0112 21.75a4.49 4.49 0 01-3.397-1.549 4.49 4.49 0 01-3.498-1.306 4.491 4.491 0 01-1.307-3.498A4.49 4.49 0 012.25 12c0-1.357.6-2.573 1.549-3.397a4.49 4.49 0 011.307-3.497 4.49 4.49 0 013.497-1.307zm7.007 6.387a.75.75 0 10-1.22-.872l-3.236 4.53L9.53 12.22a.75.75 0 00-1.06 1.06l2.25 2.25a.75.75 0 001.14-.094l3.75-5.25z" clip-rule="evenodd" />
                </svg>
              ` : ''}
            </div>
          </div>
          <div class="version-container">
            <span class="version-text">v${addon.version}</span>
          </div>
          <button class="delete-btn" onclick="deleteAddon('${addon.id}')">Eliminar</button>
          <button class="edit-btn" onclick="toggleEditForm('${addon.id}')">Editar</button>
          
          <div class="edit-form" id="editForm-${addon.id}">
            <div class="form-group">
              <label>URL de la imagen:</label>
              <input type="url" class="form-input" id="editImageUrl-${addon.id}" value="${addon.imageUrl}">
            </div>
            <div class="form-group">
              <label>Nombre:</label>
              <input type="text" class="form-input" id="editName-${addon.id}" value="${addon.name}">
            </div>
            <div class="form-group">
              <label>Versión:</label>
              <input type="text" class="form-input" id="editVersion-${addon.id}" value="${addon.version}">
            </div>
            <div class="form-group">
              <label>URL de descarga:</label>
              <input type="url" class="form-input" id="editDownloadUrl-${addon.id}" value="${addon.downloadUrl}">
            </div>
            <div class="form-actions">
              <button class="save-btn" onclick="updateAddon('${addon.id}')">Guardar</button>
              <button class="cancel-btn" onclick="toggleEditForm('${addon.id}')">Cancelar</button>
            </div>
          </div>
        </div>
      `).join('');
    }

    function toggleEditForm(addonId) {
      const form = document.getElementById(`editForm-${addonId}`);
      form.style.display = form.style.display === 'none' ? 'block' : 'none';
    }

    async function updateAddon(addonId) {
      try {
        const imageUrl = document.getElementById(`editImageUrl-${addonId}`).value;
        const name = document.getElementById(`editName-${addonId}`).value;
        const version = document.getElementById(`editVersion-${addonId}`).value;
        const downloadUrl = document.getElementById(`editDownloadUrl-${addonId}`).value;

        if (!imageUrl || !name || !version || !downloadUrl) {
          showMessage('Por favor completa todos los campos', 'error');
          return;
        }

        const data = await makeRequest(`https://api.jsonbin.io/v3/b/${JSONBIN_BIN_ID}/latest`, {
          headers: { 'X-Master-Key': JSONBIN_MASTER_KEY }
        });

        const addons = data.record?.addons || [];
        const addonIndex = addons.findIndex(addon => addon.id === addonId);

        if (addonIndex !== -1) {
          addons[addonIndex] = {
            ...addons[addonIndex],
            imageUrl: imageUrl,
            name: name,
            version: version,
            downloadUrl: downloadUrl
          };

          await makeRequest(`https://api.jsonbin.io/v3/b/${JSONBIN_BIN_ID}`, {
            method: 'PUT',
            headers: {
              'Content-Type': 'application/json',
              'X-Master-Key': JSONBIN_MASTER_KEY
            },
            body: JSON.stringify({ addons: addons })
          });

          showMessage('Addon actualizado correctamente', 'success');
          loadUserAddons();
        }

      } catch (error) {
        console.error('Error actualizando addon:', error);
        showMessage('Error al actualizar el addon', 'error');
      }
    }

    async function deleteAddon(addonId) {
      if (!confirm('¿Estás seguro de que quieres eliminar este addon? Esta acción no se puede deshacer.')) {
        return;
      }

      try {
        const data = await makeRequest(`https://api.jsonbin.io/v3/b/${JSONBIN_BIN_ID}/latest`, {
          headers: { 'X-Master-Key': JSONBIN_MASTER_KEY }
        });

        const addons = data.record?.addons || [];
        const filteredAddons = addons.filter(addon => addon.id !== addonId);

        await makeRequest(`https://api.jsonbin.io/v3/b/${JSONBIN_BIN_ID}`, {
          method: 'PUT',
          headers: {
            'Content-Type': 'application/json',
            'X-Master-Key': JSONBIN_MASTER_KEY
          },
          body: JSON.stringify({ addons: filteredAddons })
        });

        showMessage('Addon eliminado correctamente', 'success');
        loadUserAddons();

      } catch (error) {
        console.error('Error eliminando addon:', error);
        showMessage('Error al eliminar el addon', 'error');
      }
    }

    function showMessage(text, type) {
      const message = document.getElementById('message');
      message.textContent = text;
      message.className = `message ${type}`;
      message.style.display = 'block';
      
      setTimeout(() => {
        message.style.display = 'none';
      }, 5000);
    }

    document.addEventListener('DOMContentLoaded', init);
  </script>
</body>
</html>
