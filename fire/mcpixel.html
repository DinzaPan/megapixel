<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>MCPixel - MegaPixel</title>

  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;700&family=Poppins:wght@300;500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link rel="icon" href="../img/logo2.png" type="image/png">

  <style>
    :root {
      --transition-fast: 260ms;
      --primary-color: #3a86ff;
      --secondary-color: #8338ec;
      --accent-color: #ff006e;
      --dark-bg: #0a0a12;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html, body {
      height: 100%;
      background: var(--dark-bg);
      font-family: "Poppins", "Montserrat", system-ui, -apple-system, "Segoe UI", Roboto, Arial;
      color: #fff;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
      scroll-behavior: smooth;
    }

    /* BARRA SUPERIOR */
    .navbar {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      z-index: 1000;
      padding: 1.2rem 2rem;
      background: rgba(10, 10, 18, 0.98);
      backdrop-filter: blur(20px);
      border-bottom: 1px solid rgba(255, 255, 255, 0.1);
      transition: all 0.3s ease;
    }

    .navbar.scrolled {
      padding: 0.8rem 2rem;
      box-shadow: 0 5px 20px rgba(0, 0, 0, 0.3);
    }

    .nav-container {
      display: flex;
      justify-content: space-between;
      align-items: center;
      max-width: 1400px;
      margin: 0 auto;
    }

    .nav-logo {
      display: flex;
      align-items: center;
      gap: 1rem;
    }

    .nav-logo img {
      height: 70px;
      width: auto;
      transition: all 0.3s ease;
      filter: drop-shadow(0 0 15px rgba(58, 134, 255, 0.4));
    }

    .navbar.scrolled .nav-logo img {
      height: 55px;
    }

    .nav-title {
      font-size: 1.8rem;
      font-weight: 700;
      background: linear-gradient(135deg, var(--primary-color), var(--accent-color));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    /* CONTENIDO PRINCIPAL */
    .container {
      min-height: 100vh;
      padding: 120px 20px 40px;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .page-title {
      font-size: 3rem;
      font-weight: 800;
      text-align: center;
      margin-bottom: 60px;
      background: linear-gradient(135deg, var(--primary-color), var(--accent-color));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      text-shadow: 0 4px 30px rgba(58, 134, 255, 0.3);
    }

    /* GRID DE TARJETAS HORIZONTALES PARA PC */
    .cards-container {
      display: flex;
      flex-direction: column;
      gap: 25px;
      max-width: 900px;
      width: 100%;
      margin: 0 auto;
    }

    .card {
      background: rgba(10, 10, 15, 0.5);
      border-radius: 20px;
      padding: 30px;
      border: 1px solid rgba(255, 255, 255, 0.08);
      box-shadow: 0 8px 30px rgba(0, 0, 0, 0.45);
      transition: transform .28s ease, box-shadow .28s ease, background .28s ease;
      display: flex;
      align-items: center;
      gap: 25px;
      cursor: pointer;
      position: relative;
    }

    .card:hover {
      transform: translateY(-5px);
      box-shadow: 0 15px 40px rgba(0, 0, 0, 0.6);
      background: rgba(15, 15, 20, 0.7);
    }

    .logo-frame {
      width: 100px;
      height: 100px;
      border-radius: 15px;
      display: flex;
      align-items: center;
      justify-content: center;
      background: rgba(255, 255, 255, 0.03);
      border: 1px solid rgba(255, 255, 255, 0.08);
      overflow: hidden;
      flex-shrink: 0;
    }

    .logo-frame img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .card-info {
      display: flex;
      flex-direction: column;
      gap: 8px;
      flex: 1;
    }

    .card-title {
      font-size: 1.8rem;
      font-weight: 700;
      color: #ffffff;
      line-height: 1.2;
    }

    .author-container {
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .card-author {
      font-size: 1.1rem;
      color: rgba(255, 255, 255, 0.8);
      font-weight: 500;
      line-height: 1.3;
    }

    .author-name {
      color: var(--primary-color);
      font-weight: 600;
    }

    .verified-user-icon {
      color: var(--primary-color);
      width: 20px;
      height: 20px;
      margin-left: 2px;
    }

    /* VERSIÓN DE MINECRAFT */
    .version-container {
      position: absolute;
      bottom: 20px;
      right: 25px;
      display: flex;
      align-items: center;
      gap: 8px;
      background: rgba(255, 255, 255, 0.05);
      padding: 6px 12px;
      border-radius: 12px;
      border: 1px solid rgba(255, 255, 255, 0.1);
    }

    .minecraft-icon {
      width: 18px;
      height: 18px;
      color: #6AFF70;
    }

    .version-text {
      font-size: 0.9rem;
      color: rgba(255, 255, 255, 0.8);
      font-weight: 500;
    }

    /* RESPONSIVE */
    @media (max-width: 768px) {
      .navbar {
        padding: 1rem 1.5rem;
      }
      
      .nav-logo img {
        height: 55px;
      }
      
      .navbar.scrolled .nav-logo img {
        height: 45px;
      }
      
      .nav-title {
        font-size: 1.5rem;
      }
      
      .container {
        padding: 100px 15px 30px;
      }
      
      .page-title {
        font-size: 2.2rem;
        margin-bottom: 40px;
      }
      
      .cards-container {
        max-width: 500px;
      }
      
      .card {
        padding: 25px;
        gap: 20px;
      }
      
      .logo-frame {
        width: 80px;
        height: 80px;
      }
      
      .card-title {
        font-size: 1.5rem;
      }
      
      .card-author {
        font-size: 1rem;
      }
      
      .verified-user-icon {
        width: 18px;
        height: 18px;
      }
      
      .version-container {
        bottom: 15px;
        right: 20px;
        padding: 5px 10px;
      }
      
      .minecraft-icon {
        width: 16px;
        height: 16px;
      }
      
      .version-text {
        font-size: 0.85rem;
      }
    }

    @media (max-width: 480px) {
      .navbar {
        padding: 0.8rem 1rem;
      }
      
      .nav-logo img {
        height: 45px;
      }
      
      .nav-title {
        font-size: 1.3rem;
      }
      
      .container {
        padding: 90px 12px 25px;
      }
      
      .page-title {
        font-size: 1.8rem;
        margin-bottom: 30px;
      }
      
      .card {
        padding: 20px;
        gap: 15px;
        flex-direction: row;
      }
      
      .logo-frame {
        width: 70px;
        height: 70px;
      }
      
      .card-title {
        font-size: 1.3rem;
      }
      
      .card-author {
        font-size: 0.95rem;
      }
      
      .verified-user-icon {
        width: 16px;
        height: 16px;
      }
      
      .author-container {
        gap: 4px;
      }
      
      .version-container {
        bottom: 12px;
        right: 15px;
        padding: 4px 8px;
        gap: 6px;
      }
      
      .minecraft-icon {
        width: 14px;
        height: 14px;
      }
      
      .version-text {
        font-size: 0.8rem;
      }
    }
  </style>
</head>

  <script>
    const navbar = document.getElementById('navbar');
    const cards = document.querySelectorAll('.card');

    function onScroll() {
      const scrollY = window.scrollY;
      if (scrollY > 50) {
        navbar.classList.add('scrolled');
      } else {
        navbar.classList.remove('scrolled');
      }
    }

    function handleCardClick(e) {
      const url = this.getAttribute('data-url');
      if (url && url.startsWith('http')) {
        window.open(url, '_blank');
      }
    }

    function init() {
      window.addEventListener('scroll', onScroll, { passive: true });
      cards.forEach(card => {
        card.addEventListener('click', handleCardClick);
      });
    }

    if (document.readyState === 'loading') {
      document.addEventListener('DOMContentLoaded', init);
    } else {
      init();
    }
  </script>
