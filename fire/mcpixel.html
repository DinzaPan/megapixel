<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>MCPixel - MegaPixel</title>

  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;700&family=Poppins:wght@300;500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link rel="icon" href="../img/logo2.png" type="image/png">

  <style>
    :root {
      --transition-fast: 260ms;
      --primary-color: #3a86ff;
      --secondary-color: #8338ec;
      --accent-color: #ff006e;
      --dark-bg: #0a0a12;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html, body {
      height: 100%;
      background: var(--dark-bg);
      font-family: "Poppins", "Montserrat", system-ui, -apple-system, "Segoe UI", Roboto, Arial;
      color: #fff;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
      scroll-behavior: smooth;
    }

    /* BARRA SUPERIOR */
    .navbar {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      z-index: 1000;
      padding: 1.2rem 2rem;
      background: rgba(10, 10, 18, 0.98);
      backdrop-filter: blur(20px);
      border-bottom: 1px solid rgba(255, 255, 255, 0.1);
      transition: all 0.3s ease;
    }

    .navbar.scrolled {
      padding: 0.8rem 2rem;
      box-shadow: 0 5px 20px rgba(0, 0, 0, 0.3);
    }

    .nav-container {
      display: flex;
      justify-content: space-between;
      align-items: center;
      max-width: 1400px;
      margin: 0 auto;
    }

    .nav-logo {
      display: flex;
      align-items: center;
      gap: 1rem;
    }

    .nav-logo img {
      height: 70px;
      width: auto;
      transition: all 0.3s ease;
      filter: drop-shadow(0 0 15px rgba(58, 134, 255, 0.4));
    }

    .navbar.scrolled .nav-logo img {
      height: 55px;
    }

    .nav-title {
      font-size: 1.8rem;
      font-weight: 700;
      background: linear-gradient(135deg, var(--primary-color), var(--accent-color));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    /* CONTENIDO PRINCIPAL */
    .container {
      min-height: 100vh;
      padding: 120px 20px 40px;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    /* BUSCADOR */
    .search-container {
      max-width: 600px;
      width: 100%;
      margin-bottom: 50px;
      position: relative;
    }

    .search-box {
      width: 100%;
      padding: 18px 25px;
      font-size: 1.1rem;
      background: rgba(10, 10, 15, 0.6);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 15px;
      color: #fff;
      backdrop-filter: blur(10px);
      transition: all 0.3s ease;
      box-shadow: 0 8px 25px rgba(0, 0, 0, 0.3);
    }

    .search-box:focus {
      outline: none;
      border-color: var(--primary-color);
      box-shadow: 0 8px 30px rgba(58, 134, 255, 0.2);
      background: rgba(15, 15, 20, 0.7);
    }

    .search-box::placeholder {
      color: rgba(255, 255, 255, 0.5);
    }

    .search-icon {
      position: absolute;
      right: 20px;
      top: 50%;
      transform: translateY(-50%);
      color: rgba(255, 255, 255, 0.6);
      font-size: 1.2rem;
    }

    /* GRID DE TARJETAS HORIZONTALES PARA PC */
    .cards-container {
      display: flex;
      flex-direction: column;
      gap: 25px;
      max-width: 900px;
      width: 100%;
      margin: 0 auto;
    }

    .card {
      background: rgba(10, 10, 15, 0.5);
      border-radius: 20px;
      padding: 30px;
      border: 1px solid rgba(255, 255, 255, 0.08);
      box-shadow: 0 8px 30px rgba(0, 0, 0, 0.45);
      transition: transform .28s ease, box-shadow .28s ease, background .28s ease;
      display: flex;
      align-items: center;
      gap: 25px;
      cursor: pointer;
      position: relative;
    }

    .card:hover {
      transform: translateY(-5px);
      box-shadow: 0 15px 40px rgba(0, 0, 0, 0.6);
      background: rgba(15, 15, 20, 0.7);
    }

    .logo-frame {
      width: 100px;
      height: 100px;
      border-radius: 15px;
      display: flex;
      align-items: center;
      justify-content: center;
      background: rgba(255, 255, 255, 0.03);
      border: 1px solid rgba(255, 255, 255, 0.08);
      overflow: hidden;
      flex-shrink: 0;
    }

    .logo-frame img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .card-info {
      display: flex;
      flex-direction: column;
      gap: 8px;
      flex: 1;
    }

    .card-title {
      font-size: 1.8rem;
      font-weight: 700;
      color: #ffffff;
      line-height: 1.2;
    }

    .author-container {
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .card-author {
      font-size: 1.1rem;
      color: rgba(255, 255, 255, 0.8);
      font-weight: 500;
      line-height: 1.3;
    }

    .author-name {
      color: var(--primary-color);
      font-weight: 600;
    }

    .verified-user-icon {
      color: var(--primary-color);
      width: 20px;
      height: 20px;
      margin-left: 2px;
    }

    /* VERSIÓN DE MINECRAFT */
    .version-container {
      position: absolute;
      bottom: 20px;
      right: 25px;
      display: flex;
      align-items: center;
      gap: 8px;
      background: rgba(255, 255, 255, 0.05);
      padding: 6px 12px;
      border-radius: 12px;
      border: 1px solid rgba(255, 255, 255, 0.1);
    }

    .version-text {
      font-size: 0.9rem;
      color: rgba(255, 255, 255, 0.8);
      font-weight: 500;
    }

    /* BOTÓN FLOTANTE */
    .floating-btn {
      position: fixed;
      bottom: 30px;
      right: 30px;
      width: 60px;
      height: 60px;
      background: var(--primary-color);
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      color: white;
      font-size: 1.5rem;
      cursor: pointer;
      box-shadow: 0 4px 20px rgba(58, 134, 255, 0.4);
      transition: all 0.3s ease;
      z-index: 1000;
      border: none;
    }

    .floating-btn:hover {
      transform: scale(1.1);
      box-shadow: 0 6px 25px rgba(58, 134, 255, 0.6);
    }

    /* MENSAJE DE NO RESULTADOS */
    .no-results {
      text-align: center;
      color: rgba(255, 255, 255, 0.6);
      font-size: 1.2rem;
      margin-top: 40px;
      display: none;
    }

    /* LOADING */
    .loading {
      text-align: center;
      color: rgba(255, 255, 255, 0.6);
      font-size: 1.2rem;
      margin-top: 40px;
    }

    /* RESPONSIVE */
    @media (max-width: 768px) {
      .navbar {
        padding: 1rem 1.5rem;
      }
      
      .nav-logo img {
        height: 55px;
      }
      
      .navbar.scrolled .nav-logo img {
        height: 45px;
      }
      
      .nav-title {
        font-size: 1.5rem;
      }
      
      .container {
        padding: 100px 15px 30px;
      }
      
      .search-container {
        max-width: 500px;
        margin-bottom: 40px;
      }
      
      .search-box {
        padding: 16px 20px;
        font-size: 1rem;
      }
      
      .cards-container {
        max-width: 500px;
      }
      
      .card {
        padding: 25px;
        gap: 20px;
      }
      
      .logo-frame {
        width: 80px;
        height: 80px;
      }
      
      .card-title {
        font-size: 1.5rem;
      }
      
      .card-author {
        font-size: 1rem;
      }
      
      .verified-user-icon {
        width: 18px;
        height: 18px;
      }
      
      .version-container {
        bottom: 15px;
        right: 20px;
        padding: 5px 10px;
      }
      
      .version-text {
        font-size: 0.85rem;
      }
      
      .floating-btn {
        width: 50px;
        height: 50px;
        bottom: 20px;
        right: 20px;
      }
    }

    @media (max-width: 480px) {
      .navbar {
        padding: 0.8rem 1rem;
      }
      
      .nav-logo img {
        height: 45px;
      }
      
      .nav-title {
        font-size: 1.3rem;
      }
      
      .container {
        padding: 90px 12px 25px;
      }
      
      .search-container {
        margin-bottom: 30px;
      }
      
      .search-box {
        padding: 14px 18px;
      }
      
      .card {
        padding: 20px;
        gap: 15px;
        flex-direction: row;
      }
      
      .logo-frame {
        width: 70px;
        height: 70px;
      }
      
      .card-title {
        font-size: 1.3rem;
      }
      
      .card-author {
        font-size: 0.95rem;
      }
      
      .verified-user-icon {
        width: 16px;
        height: 16px;
      }
      
      .author-container {
        gap: 4px;
      }
      
      .version-container {
        bottom: 12px;
        right: 15px;
        padding: 4px 8px;
        gap: 6px;
      }
      
      .version-text {
        font-size: 0.8rem;
      }
    }
  </style>
</head>
<body>

  <nav class="navbar" id="navbar">
    <div class="nav-container">
      <div class="nav-logo">
        <img src="./img/logo.png" alt="MegaPixelFL">
        <div class="nav-title">MCPixel</div>
      </div>
    </div>
  </nav>

  <div class="container">
    <!-- BUSCADOR -->
    <div class="search-container">
      <input type="text" class="search-box" id="searchBox" placeholder="Buscar addons por nombre o creador...">
      <i class="fas fa-search search-icon"></i>
    </div>
    
    <!-- MENSAJE DE NO RESULTADOS -->
    <div class="no-results" id="noResults">
      No se encontraron addons que coincidan con tu búsqueda
    </div>

    <!-- LOADING -->
    <div class="loading" id="loading">
      Cargando addons...
    </div>
    
    <!-- TARJETAS -->
    <div class="cards-container" id="cardsContainer"></div>
  </div>

  <script src="./js/list.js"></script>
  <script>
    const navbar = document.getElementById('navbar');
    const searchBox = document.getElementById('searchBox');
    const cardsContainer = document.getElementById('cardsContainer');
    const noResults = document.getElementById('noResults');
    const loading = document.getElementById('loading');

    // CONFIGURACIÓN ACTUALIZADA CON TUS DATOS REALES
    const JSONBIN_BIN_ID = '690d4c7843b1c97be99dc705';
    const JSONBIN_MASTER_KEY = '$2a$10$IO4HdN4Wy8PwCaYknx9Yxegti3kHcf8gxUWMldt2yaEuuhDZxvD/2';
    let lastRequestTime = 0;
    const REQUEST_DELAY = 1000; // 1 segundo entre peticiones

    // Función para hacer peticiones con rate limiting
    async function makeRequest(url, options = {}) {
      const now = Date.now();
      const timeSinceLastRequest = now - lastRequestTime;
      
      if (timeSinceLastRequest < REQUEST_DELAY) {
        await new Promise(resolve => setTimeout(resolve, REQUEST_DELAY - timeSinceLastRequest));
      }
      
      lastRequestTime = Date.now();
      const response = await fetch(url, options);
      return response.json();
    }

    // Cargar addons desde JSONBin.io
    async function loadAddons() {
      try {
        loading.style.display = 'block';
        cardsContainer.style.display = 'none';
        
        const data = await makeRequest(`https://api.jsonbin.io/v3/b/${JSONBIN_BIN_ID}/latest`, {
          headers: {
            'X-Master-Key': JSONBIN_MASTER_KEY
          }
        });
        
        const addons = data.record?.addons || [];
        displayAddons(addons);
        
      } catch (error) {
        console.error('Error cargando addons:', error);
        cardsContainer.innerHTML = '<div class="no-results">Error al cargar los addons</div>';
        loading.style.display = 'none';
        cardsContainer.style.display = 'block';
      }
    }

    // Mostrar addons en tarjetas
    function displayAddons(addons) {
      loading.style.display = 'none';
      cardsContainer.style.display = 'flex';
      
      if (addons.length === 0) {
        noResults.style.display = 'block';
        cardsContainer.innerHTML = '';
        return;
      }
      
      noResults.style.display = 'none';
      
      cardsContainer.innerHTML = addons.map(addon => `
        <div class="card" data-url="${addon.downloadUrl}" data-name="${addon.name}" data-author="${addon.author}">
          <div class="logo-frame">
            <img src="${addon.imageUrl}" alt="${addon.name}" onerror="this.src='https://via.placeholder.com/150/0a0a12/3a86ff?text=Addon'">
          </div>
          <div class="card-info">
            <h2 class="card-title">${addon.name}</h2>
            <div class="author-container">
              <p class="card-author">by <span class="author-name">${addon.author}</span></p>
              ${verifiedUsers.includes(addon.author) ? `
                <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="currentColor" class="verified-user-icon">
                  <path fill-rule="evenodd" d="M8.603 3.799A4.49 4.49 0 0112 2.25c1.357 0 2.573.6 3.397 1.549a4.49 4.49 0 013.498 1.307 4.491 4.491 0 011.307 3.497A4.49 4.49 0 0121.75 12a4.49 4.49 0 01-1.549 3.397 4.491 4.491 0 01-1.307 3.497 4.491 4.491 0 01-3.497 1.307A4.49 4.49 0 0112 21.75a4.49 4.49 0 01-3.397-1.549 4.49 4.49 0 01-3.498-1.306 4.491 4.491 0 01-1.307-3.498A4.49 4.49 0 012.25 12c0-1.357.6-2.573 1.549-3.397a4.49 4.49 0 011.307-3.497 4.49 4.49 0 013.497-1.307zm7.007 6.387a.75.75 0 10-1.22-.872l-3.236 4.53L9.53 12.22a.75.75 0 00-1.06 1.06l2.25 2.25a.75.75 0 001.14-.094l3.75-5.25z" clip-rule="evenodd" />
                </svg>
              ` : ''}
            </div>
          </div>
          <div class="version-container">
            <span class="version-text">v${addon.version}</span>
          </div>
        </div>
      `).join('');
      
      // Agregar event listeners a las nuevas tarjetas
      document.querySelectorAll('.card').forEach(card => {
        card.addEventListener('click', handleCardClick);
      });
    }

    // Función de búsqueda
    function handleSearch() {
      const searchTerm = searchBox.value.toLowerCase().trim();
      const cards = document.querySelectorAll('.card');
      let hasResults = false;

      cards.forEach(card => {
        const cardName = card.getAttribute('data-name').toLowerCase();
        const cardAuthor = card.getAttribute('data-author').toLowerCase();
        
        if (cardName.includes(searchTerm) || cardAuthor.includes(searchTerm)) {
          card.style.display = 'flex';
          hasResults = true;
        } else {
          card.style.display = 'none';
        }
      });

      // Mostrar mensaje de no resultados
      if (!hasResults && searchTerm !== '') {
        noResults.style.display = 'block';
      } else {
        noResults.style.display = 'none';
      }
    }

    function onScroll() {
      const scrollY = window.scrollY;
      if (scrollY > 50) {
        navbar.classList.add('scrolled');
      } else {
        navbar.classList.remove('scrolled');
      }
    }

    function handleCardClick(e) {
      const url = this.getAttribute('data-url');
      if (url && url.startsWith('http')) {
        window.open(url, '_blank');
      }
    }

    function init() {
      window.addEventListener('scroll', onScroll, { passive: true });
      searchBox.addEventListener('input', handleSearch);
      loadAddons();
    }

    if (document.readyState === 'loading') {
      document.addEventListener('DOMContentLoaded', init);
    } else {
      init();
    }
  </script>
</body>
</html>
